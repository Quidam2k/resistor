<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resistor{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-root="{{ request.script_root }}">
  <header>
    <h1>✊ Resistor — Approval Queue</h1>
    <nav>
      <a href="{{ url_for('index') }}">Queue</a>
      <a href="{{ url_for('history') }}">History</a>
    </nav>
  </header>
  {% if dry_run %}
  <div class="dry-run-banner">DRY RUN MODE — approvals will NOT send anything</div>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
